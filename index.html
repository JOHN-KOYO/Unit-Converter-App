<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
    <title>The Unit Converter</title>
</head>
<body>
<div class="container">

    <h2>Metric/Imperial Unit Conversion</h2>
    <input type="text" id="inputValue" placeholder="value">
    <button id="convertBtn">Convert</button>

</div>
<div class="output">
    <p id="outputValue1">Length(Meter/Feet)</p>
    <p id="outputValue2">Volume(Liters/Gallons)</p>
    <p id="outputValue3">Mass(Kilograms/Pounds)</p>

</div>
<script src="index.js"></script>

</body>
</html>
